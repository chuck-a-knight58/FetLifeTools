# When to run this directory's scripts. After editing, apply it with:
#
#     python3 schedule.py install
#
# One job per line:  minute  hour  day  month  weekday  script [arguments]
#
#   minute   0-59
#   hour     0-23            (24-hour clock, this Mac's time zone)
#   day      1-31            (day of the month)
#   month    1-12 or jan-dec
#   weekday  0-7 or sun-sat  (0 and 7 are both Sunday)
#
# Each field is * (any), a number, a list (1,15), a range (mon-fri), or a
# step (*/15 = every 15). A job runs when every field matches. Unlike
# crontab, a line with both a day and a weekday needs both to match:
# 1-7 * mon is the first Monday of the month, 13 * fri is Friday the 13th.
# (The job checks the day itself when it starts, so if the Mac was asleep
# until after those days, that run is skipped.)
# The script is a path relative to this directory; it runs here, with
# .venv/bin on its PATH (so `fetlife` works without activating the venv),
# and its output goes to logs/<script>.log. If the Mac is asleep at the
# time, the job runs when it wakes; if it's shut down, that run is skipped.
#
# Examples:
#   30 6 * * *     update_community_calendar.sh      every day at 6:30 AM
#   0 9 1 * *      monthly_engagement_prompt.sh      the 1st of each month, 9:00 AM
#   0 22 * * fri   go.sh                             Fridays at 10:00 PM
#   0 */6 * * *    update_community_calendar.sh      every 6 hours

# minute hour day month weekday  script
0 8 * * mon    update_community_calendar.sh
0 9 1-7 * mon  monthly_engagement_prompt.sh
0 10 * * mon   post_think_about_it_monday.sh
0 10 * * wed   post_word_of_the_week.sh