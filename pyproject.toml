[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fetlife-tools"
version = "0.1.0"
description = "Command-line tools for querying the FetLife website"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chuck Knight" }]
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# `requests` + `responses` are used only to mock HTTP in the offline test suite.
dev = ["pytest>=7.4", "pytest-mock>=3.12", "responses>=0.24", "requests>=2.31"]

[project.scripts]
fetlife = "fetlife.cli:main"

[tool.setuptools.packages.find]
include = ["fetlife*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
