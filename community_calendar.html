      + (ev.image ? '<a class="card-image" href="' + esc(ev.url) + '" target="_blank" rel="noopener" tabindex="-1"><img src="' + esc(ev.image) + '" alt="" loading="lazy"></a>' : '')
      + '<div class="card-body">'
      + (t ? '<div class="card-time">' + esc(t) + '</div>' : '')
      + '<div class="card-cat" style="color:' + esc(colorOf(ev)) + '">' + esc(ev.category) + (ev.cost ? ' · ' + esc(ev.cost) : '') + '</div>'
      + '<div class="card-title"><a href="' + esc(ev.url) + '" target="_blank" rel="noopener">' + esc(ev.name) + '</a></div>'
      + (ev.when ? '<div class="card-line"><span class="label">When:</span> ' + esc(ev.when) + '</div>'
                 : (dates ? '<div class="card-line"><span class="label">When:</span> ' + esc(dates) + '</div>' : ''))
      + (ev.venue ? '<div class="card-line"><span class="label">Where:</span> ' + esc(ev.venue) + '</div>' : '')
      + (ev.city ? '<div class="card-line"><span class="label">' + (ev.venue ? '' : 'Where: ') + '</span>' + esc(ev.city) + '</div>' : '')
      + (ev.rsvps != null ? '<div class="card-line"><span class="label">RSVPs:</span> ' + esc(ev.rsvps) + '</div>' : '')
      + '<a class="card-link" href="' + esc(ev.url) + '" target="_blank" rel="noopener">View on FetLife</a>'
      + '</div></article>';
  }

  // ---- Calendar: Overview (every month in range, compact) ----
  var overviewEl = document.getElementById('overview');
  function renderOverview() {
    var html = '';
    var m = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
    for (; m <= rangeEnd; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
      var year = m.getFullYear(), month = m.getMonth();
      var firstDay = m.getDay();
      var daysInMonth = new Date(year, month + 1, 0).getDate();
      html += '<div class="calendar-month"><div class="calendar-month-title">' + monthNames[month] + ' ' + year + '</div>';
      html += '<div class="calendar-weekdays">';
      weekdays.forEach(function (w) { html += '<div>' + w + '</div>'; });
      html += '</div><div class="calendar-days">';
      for (var i = 0; i < firstDay; i++) html += '<div></div>';
      for (var d = 1; d <= daysInMonth; d++) {
        var day = new Date(year, month, d), k = iso(day);
        var evs = byDay[k];
        if (!inRange(day)) {
          html += '<div class="out">' + d + '</div>';
        } else if (evs && evs.length) {
          var colors = [];
          evs.forEach(function (ev) { var c = colorOf(ev); if (colors.indexOf(c) === -1) colors.push(c); });
          var bg = colors.length === 1 ? colors[0] : '#daa520';
          // One dot per event (in its category's color) when there's more than one.
          var dots = evs.length > 1
            ? evs.slice(0, 5).map(function (ev) { return '<span style="background:' + esc(colorOf(ev)) + '"></span>'; }).join('')
              + (evs.length > 5 ? '<b>+</b>' : '')
            : '';
          html += '<a class="calendar-day-event" href="' + dayHref(k) + '" target="_blank" data-day="' + k + '" style="background:' + esc(bg) + '"'
            + ' aria-label="' + esc(longDate(k) + ': ' + evs.length + ' event' + (evs.length === 1 ? '' : 's') + ' (opens in a new tab)') + '">'
            + d + '<div class="dots">' + dots + '</div></a>';
        } else {
          html += '<div>' + d + '</div>';
        }
      }
      html += '</div></div>';
    }
    overviewEl.innerHTML = html;
  }

  // ---- Hover card for an Overview day ----
  var popup = document.getElementById('event-popup');
  function showPopup(cell) {
    var k = cell.getAttribute('data-day');
    var evs = sortedOn(byDay[k] || [], k);
    var html = '<div class="ep-date">' + esc(longDate(k)) + '</div>';
    evs.slice(0, MAX_POPUP).forEach(function (ev) {
      var multi = ev.end && ev.end !== ev.start ? shortDate(ev.start) + ' – ' + shortDate(ev.end) : '';
      html += '<div class="ep-item">'
        + (ev.image ? '<img src="' + esc(ev.image) + '" alt="">' : '')
        + '<div><div class="ep-title" style="color:' + esc(colorOf(ev)) + '">' + esc(ev.name) + '</div>'
        + '<div class="ep-meta">' + esc(ev.category) + (ev.cost ? ' · ' + esc(ev.cost) : '') + '</div>'
        + '<div>' + esc(ev.when || multi) + '</div>'
        + (place(ev) ? '<div class="ep-meta">' + esc(place(ev)) + '</div>' : '')
        + '</div></div>';
    });
    if (evs.length > MAX_POPUP) {
      html += '<div class="ep-more">+ ' + (evs.length - MAX_POPUP) + ' more — click the day to see them all</div>';
    }
    popup.innerHTML = html;
    popup.style.display = 'block';

    var rect = cell.getBoundingClientRect();
    var scrollX = window.pageXOffset, scrollY = window.pageYOffset;
    var w = popup.offsetWidth, h = popup.offsetHeight;
    var left = rect.left + scrollX + rect.width / 2 - w / 2;
    var top = rect.bottom + scrollY + 6;
    var maxLeft = scrollX + document.documentElement.clientWidth - w - 8;
    if (left > maxLeft) left = maxLeft;
    if (left < scrollX + 8) left = scrollX + 8;
    if (rect.bottom + h + 12 > document.documentElement.clientHeight && rect.top > h + 12) {
      top = rect.top + scrollY - h - 6;
    }
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
  }
  function hidePopup() { popup.style.display = 'none'; }
  overviewEl.addEventListener('mouseover', function (e) {
    var cell = e.target.closest('.calendar-day-event');
    if (cell) showPopup(cell);
  });
  overviewEl.addEventListener('mouseout', function (e) {
    var cell = e.target.closest('.calendar-day-event');
    if (cell && !cell.contains(e.relatedTarget)) hidePopup();
  });
  overviewEl.addEventListener('focusin', function (e) {
    var cell = e.target.closest('.calendar-day-event');
    if (cell) showPopup(cell);
  });
  overviewEl.addEventListener('focusout', hidePopup);
  overviewEl.addEventListener('click', hidePopup);

  // ---- Calendar: Month / Week / Day, one period at a time ----
  var periodEl = document.getElementById('period');
  var navEl = document.getElementById('cal-nav');
  var today = new Date(); today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  var cursor = inRange(today) ? today : rangeStart;
  var sub = 'overview';

  function weekStart(d) { return addDays(d, -d.getDay()); }
  function chipHtml(ev, k) {
    var t = timeOn(ev, k);
    return '<a class="chip" href="' + esc(ev.url) + '" target="_blank" rel="noopener" style="border-left-color:' + esc(colorOf(ev)) + '"'
      + ' title="' + esc(ev.name + (t ? ' — ' + t : '') + (place(ev) ? ' — ' + place(ev) : '')) + '">'
      + (t ? '<span class="t">' + esc(t) + '</span> ' : '') + esc(ev.name) + '</a>';
  }

  function renderMonth() {
    var first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    var daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    var html = '<div class="mv-weekdays">';
    dayNames.forEach(function (n) { html += '<div>' + n.slice(0, 3) + '</div>'; });
    html += '</div><div class="mv-grid">';
    for (var i = 0; i < first.getDay(); i++) html += '<div class="mv-cell blank"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var day = new Date(first.getFullYear(), first.getMonth(), d), k = iso(day);
      if (!inRange(day)) {
        html += '<div class="mv-cell out"><div class="mv-date">' + d + '</div></div>';
        continue;
      }
      var evs = sortedOn(byDay[k] || [], k);
      html += '<div class="mv-cell" data-day="' + k + '">'
        + '<a class="mv-date date-link" href="' + dayHref(k) + '" target="_blank" title="Open ' + esc(longDate(k)) + ' in a new tab">' + d + '</a>';
      evs.slice(0, MAX_CHIPS).forEach(function (ev) { html += chipHtml(ev, k); });
      if (evs.length > MAX_CHIPS) html += '<div class="mv-more">+ ' + (evs.length - MAX_CHIPS) + ' more</div>';
      if (evs.length) {
        html += '<div class="dotrow">' + evs.map(function (ev) { return '<span style="background:' + esc(colorOf(ev)) + '"></span>'; }).join('') + '</div>';
      }
      html += '</div>';
    }
    periodEl.innerHTML = html + '</div>';
    return esc(monthNames[first.getMonth()] + ' ' + first.getFullYear());
  }

  function renderWeek() {
    var ws = weekStart(cursor), we = addDays(ws, 6);
    var html = '<div class="wv-grid">';
    for (var i = 0; i < 7; i++) {
      var day = addDays(ws, i), k = iso(day);
      var evs = inRange(day) ? sortedOn(byDay[k] || [], k) : [];
      html += '<div class="wv-col' + (inRange(day) ? '' : ' out') + '"><div class="wv-head">'
        + '<span class="dn">' + dayNames[day.getDay()].slice(0, 3) + '</span>'
        + (inRange(day)
            ? '<a class="dd date-link" href="' + dayHref(k) + '" target="_blank" title="Open ' + esc(longDate(k)) + ' in a new tab">' + day.getDate() + '</a>'
            : '<span class="dd">' + day.getDate() + '</span>')
        + '</div><div class="wv-body">';
      evs.forEach(function (ev) {
        var t = timeOn(ev, k);
        html += '<a class="wv-ev" href="' + esc(ev.url) + '" target="_blank" rel="noopener" style="border-left-color:' + esc(colorOf(ev)) + '">'
          + (t ? '<span class="t">' + esc(t) + '</span>' : '')
          + '<span class="n">' + esc(ev.name) + '</span>'
          + (place(ev) ? '<span class="p">' + esc(place(ev)) + '</span>' : '')
          + '</a>';
      });
      if (inRange(day) && !evs.length) html += '<div class="wv-none">No events</div>';
      html += '</div></div>';
    }
    periodEl.innerHTML = html + '</div>';
    return esc((ws.getFullYear() === we.getFullYear()
      ? shortDate(iso(ws)) : shortDate(iso(ws)) + ', ' + ws.getFullYear())
      + ' – ' + shortDate(iso(we)) + ', ' + we.getFullYear());
  }

  function renderDay() {
    var k = iso(cursor);
    var evs = sortedOn(byDay[k] || [], k);
    var html = '<div class="dv-hint">' + evs.length + ' event' + (evs.length === 1 ? '' : 's') + ' · click the date to open this day in a new tab</div>';
    html += evs.length
      ? '<div class="cards">' + evs.map(function (ev) { return cardHtml(ev, k); }).join('') + '</div>'
      : '<p class="empty">No events on this day.</p>';
    periodEl.innerHTML = html;
    return '<a class="date-link" href="' + dayHref(k) + '" target="_blank" title="Open this day in a new tab">' + esc(longDate(k)) + '</a>';
  }

  // The period before/after the cursor, and whether it still touches the range.
  function shifted(step) {
    if (sub === 'month') return new Date(cursor.getFullYear(), cursor.getMonth() + step, 1);
    if (sub === 'week') return addDays(weekStart(cursor), 7 * step);
    return addDays(cursor, step);
  }
  function touchesRange(d) {
    if (sub === 'month') {
      var a = new Date(d.getFullYear(), d.getMonth(), 1), b = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      return b >= rangeStart && a <= rangeEnd;
    }
    if (sub === 'week') { var ws = weekStart(d); return addDays(ws, 6) >= rangeStart && ws <= rangeEnd; }
    return inRange(d);
  }
  function clampToRange(d) { return d < rangeStart ? rangeStart : d > rangeEnd ? rangeEnd : d; }

  function renderPeriod() {
    if (sub === 'overview') return;
    var label = sub === 'month' ? renderMonth() : sub === 'week' ? renderWeek() : renderDay();
    document.getElementById('nav-label').innerHTML = label;
    document.getElementById('nav-prev').disabled = !touchesRange(shifted(-1));
    document.getElementById('nav-next').disabled = !touchesRange(shifted(1));
  }
  function step(n) {
    var d = shifted(n);
    if (!touchesRange(d)) return;
    cursor = clampToRange(d);
    renderPeriod();
  }
  document.getElementById('nav-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('nav-next').addEventListener('click', function () { step(1); });

  // In the Month view, a click anywhere in a day's box (other than on an
  // event) opens that day in a new tab, like its date.
  periodEl.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var cell = e.target.closest('.mv-cell[data-day]');
    if (cell) openDayTab(cell.getAttribute('data-day'));
  });

  var subButtons = document.querySelectorAll('[data-sub]');
  function setSub(mode) {
    sub = mode;
    hidePopup();
    subButtons.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-sub') === mode); });
    overviewEl.hidden = mode !== 'overview';
    periodEl.hidden = navEl.hidden = mode === 'overview';
    renderPeriod();
    try { localStorage.setItem('fetlifeEventsCalendarView', mode); } catch (e) {}
  }
  subButtons.forEach(function (b) {
    b.addEventListener('click', function () { setSub(b.getAttribute('data-sub')); });
  });

  // ---- List view: each event under its first day in range ----
  // With a day in the URL (#day=YYYY-MM-DD, how a clicked date opens), only
  // that day's events are listed, multi-day events still running included.
  var listEl = document.getElementById('list-view');
  var onlyDay = null;
  function renderList(list) {
    var html = '';
    if (onlyDay) {
      var evs = sortedOn(byDay[onlyDay] || [], onlyDay);
      html += '<div class="day-banner">Showing ' + esc(longDate(onlyDay)) + ' only · <a href="#" id="show-all">Show all events</a></div>'
        + '<section class="list-day"><h2>' + esc(longDate(onlyDay)) + '</h2>'
        + (evs.length ? '<div class="cards">' + evs.map(function (ev) { return cardHtml(ev, onlyDay); }).join('') + '</div>'
                      : '<p class="empty">No events on this day.</p>')
        + '</section>';
      listEl.innerHTML = html;
      return;
    }
    var groups = {}, order = [];
    list.forEach(function (ev) {
      var k = ev.start < CONFIG.start ? CONFIG.start : ev.start;
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(ev);
    });
    order.sort();
    order.forEach(function (k) {
      html += '<section class="list-day" id="day-' + k + '"><h2>' + esc(longDate(k)) + '</h2><div class="cards">'
        + sortedOn(groups[k], k).map(function (ev) { return cardHtml(ev, k); }).join('')
        + '</div></section>';
    });
    listEl.innerHTML = html;
  }
  listEl.addEventListener('click', function (e) {
    if (e.target.id !== 'show-all') return;
    e.preventDefault();
    history.replaceState(null, '', location.pathname + location.search);
    readHash();
  });

  // ---- View switching (remembered per browser) ----
  var calendarEl = document.getElementById('calendar-view');
  function setView(mode, remember) {
    var list = mode === 'list';
    hidePopup();
    calendarEl.hidden = list;
    listEl.hidden = !list;
    document.getElementById('btn-view-calendar').classList.toggle('active', !list);
    document.getElementById('btn-view-list').classList.toggle('active', list);
    if (remember !== false) {
      try { localStorage.setItem('fetlifeEventsView', mode); } catch (e) {}
    }
  }
  document.getElementById('btn-view-calendar').addEventListener('click', function () { setView('calendar'); });
  document.getElementById('btn-view-list').addEventListener('click', function () { setView('list'); });
  document.getElementById('search').addEventListener('input', function (e) {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  function render() {
    var list = EVENTS.filter(visible);
    byDay = eventsByDay(list);
    renderOverview();
    renderPeriod();
    renderList(list);
    renderWords();
    document.getElementById('empty').hidden = list.length > 0;
  }

  function readHash() {
    var m = /^#day=(\d{4}-\d\d-\d\d)$/.exec(location.hash);
    onlyDay = m ? m[1] : null;
    if (onlyDay) {
      cursor = clampToRange(parse(onlyDay));
      document.title = longDate(onlyDay) + ' — ' + document.title.replace(/^.* — /, '');
    }
    render();
    if (onlyDay) { setView('list', false); window.scrollTo(0, 0); }
  }
  window.addEventListener('hashchange', readHash);

  try {
    var savedSub = localStorage.getItem('fetlifeEventsCalendarView');
    if (savedSub && document.querySelector('[data-sub="' + savedSub + '"]')) sub = savedSub;
  } catch (e) {}
  setSub(sub);
  readHash();
  if (!onlyDay) {
    try { if (localStorage.getItem('fetlifeEventsView') === 'list') setView('list'); } catch (e) {}
  }
})();
</script>
</body>
</html>
